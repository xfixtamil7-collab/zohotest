<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zoho Voice Automation Console</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-primary);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 0 1px 1px var(--border-glow);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .logo {
      display: inline-flex;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .login-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: rgba(10, 10, 20, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 8px rgba(127, 86, 217, 0.4);
    }
    .btn-login {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--accent-gradient);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(127, 86, 217, 0.3);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(127, 86, 217, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-alert {
      background-color: rgba(240, 68, 56, 0.1);
      border: 1px solid var(--danger);
      color: #ff8880;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="glow-bg" style="top: 20%; left: 20%; width: 60vw; height: 60vw;"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <span class="pulse-dot"></span>
          <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; margin-left: 0.75rem;">Zoho Voice</h1>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to access the control console</p>
      </div>

      <div class="error-alert" id="errorAlert">
        ⚠️ Invalid username or password. Please try again.
      </div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">👤 Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">🔑 Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    // Check if URL has error query parameter
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      document.getElementById('errorAlert').style.display = 'flex';
    }
  </script>
</body>
</html>
